# TradingAgents 的部署自描述 —— vps-deploy 标准（接入指南：~/projects/vps-deploy-standard.md）
# 工具：dev ~/projects/vps-ops / VPS /srv/vps-ops；命令：vps-deploy tradingagents
name = "tradingagents"
runtime = "python"
repo = "https://github.com/flywalt/TradingAgents.git"
branch = "main"                      # fork 只有 main（无 master）

build = [
  "python3 -m venv .venv",
  ".venv/bin/pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements-downstream.txt",
  ".venv/bin/pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -e .",
  ".venv/bin/python -c 'import tushare; import tradingagents_web.app'",   # 缺依赖（含 tushare 漏声明的 six）在 build 期暴露，不留给健康检查
]

domain = "ta.dafeis.com"
spa = false                           # 服务端渲染多页应用：无 dist，全部请求反代给 ui
api_paths = ["/*"]                    # /、/history、/runs/*、/static/* 都是动态页，catch-all 必须反代而非 file_server
static_root = "dist"                  # 占位：handle /* 在前，此 root 永不命中（见上行注释）

# 按当前 LLM provider（openai-compatible）写死；换 provider 时同步改这一行，
# 否则 preflight 拦一个用不到的键、放行真正缺的那个（见 deploy/README.md）。
env_required = ["TRADINGAGENTS_ENGINE_TOKEN", "OPENAI_COMPATIBLE_API_KEY", "TUSHARE_TOKEN"]
limits = { memory = "800M", cpu = "200%" }

backup = { paths = ["data/web/state.db", "data/memory", "data/logs"], keep = 7, cron = "0 20 * * *" }

[[units]]
name = "engine"
start = "-m tradingagents_web --role engine --host 127.0.0.1 --port 8802"
port = 8802
health = "/healthz"

[[units]]
name = "ui"
start = "-m tradingagents_web --role ui --host 127.0.0.1 --port 8801 --engine http://127.0.0.1:8802"
port = 8801
health = "/healthz"
public = true
depends_on = ["engine"]

[[external]]
name = "rsshub"
url = "https://rsshub.dafeis.com"
note = "新闻源旁路走外部 RSSHub 实例（不在本机），缺了降级不阻断；自托管参考见 deploy/rsshub/"

# 统一鉴权门（vps-deploy [auth]）：站点先过 tinyauth，未认证 302 到 auth.dafeis.com；
# 认证通过时 Caddy 注入 Remote-User 等头（应用内令牌仍是第二道锁）。
[auth]
forward = "http://127.0.0.1:8810"
login = "https://auth.dafeis.com"
redirect_header = "X-Tinyauth-Location"
